# Draft API contract for the test run.
# Replace with the schema generated by the Django backend (drf-spectacular)
# once the backend exists. Keep the paths and field names in sync with it.
openapi: 3.0.3
info:
  title: tenso Materials Ordering API (draft)
  version: 0.1.0
servers:
  - url: /api
paths:
  /auth/login/:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
  /auth/logout/:
    post:
      operationId: logout
      responses:
        '204':
          description: Logged out
  /auth/me/:
    get:
      operationId: currentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /sites/:
    get:
      operationId: listSites
      responses:
        '200':
          description: Warehouse sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'
  /items/:
    get:
      operationId: listItems
      responses:
        '200':
          description: Items with lot sizes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  /orders/:
    get:
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Orders for the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order accepted (status In progress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Validation failed (for example, under minimum lot)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /orders/{id}/:
    get:
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order with status history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{id}/resubmit/:
    post:
      operationId: resubmitOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '200':
          description: Resubmitted order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /approvals/batch/:
    get:
      operationId: getDailyBatch
      responses:
        '200':
          description: Pending orders grouped by warehouse and item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchGroup'
  /approvals/{id}/approve/:
    post:
      operationId: approveOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /approvals/{id}/return/:
    post:
      operationId: returnOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnInput'
      responses:
        '200':
          description: Returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Reason missing
  /transfers/:
    get:
      operationId: listTransfers
      responses:
        '200':
          description: Batch transfer status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transfer'
  /billing/months/{month}/:
    get:
      operationId: getBillingMonth
      description: Monthly billing per warehouse site. tenso approvers only.
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Billing for the month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingMonth'
        '403':
          description: Not allowed for this role
  /billing/months/{month}/sites/{siteId}/confirm/:
    post:
      operationId: confirmBillingSite
      description: tenso confirms a site's amount. Needs an invoice for that site.
      parameters:
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSite'
        '403':
          description: Not allowed for this role
        '422':
          description: No invoice for this site yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /billing/months/{month}/statement/:
    get:
      operationId: getBillingStatement
      description: The warehouse's own statement for the month. Warehouse users only.
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Statement for the user's site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStatement'
        '403':
          description: Not allowed for this role
components:
  parameters:
    Month:
      name: month
      in: path
      required: true
      description: Year and month, as YYYY-MM.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}$'
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: integer
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    User:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [warehouse, tenso]
        siteCode:
          type: string
          nullable: true
    Site:
      type: object
      required: [id, name, destinationCode]
      properties:
        id:
          type: integer
        name:
          type: string
        destinationCode:
          type: string
    Item:
      type: object
      required: [id, name, minLot]
      properties:
        id:
          type: integer
        name:
          type: string
        minLot:
          type: integer
          description: Orders must be a multiple of this quantity.
    OrderStatus:
      type: string
      enum: [in_progress, returned, approved, transferred]
    OrderInput:
      type: object
      required: [itemId, quantity, deliveryDate, destinationCode]
      properties:
        itemId:
          type: integer
        quantity:
          type: integer
        deliveryDate:
          type: string
          format: date
        destinationCode:
          type: string
    Order:
      type: object
      required: [id, itemId, quantity, deliveryDate, destinationCode, status]
      properties:
        id:
          type: integer
        itemId:
          type: integer
        quantity:
          type: integer
        deliveryDate:
          type: string
          format: date
        destinationCode:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        returnReason:
          type: string
          nullable: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/StatusChange'
    StatusChange:
      type: object
      required: [status, changedAt]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        changedAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
    ReturnInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
    BatchGroup:
      type: object
      required: [warehouse, item, orders]
      properties:
        warehouse:
          type: string
        item:
          type: string
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    Transfer:
      type: object
      required: [id, createdAt, status]
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [sent, failed]
    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
        field:
          type: string
          nullable: true
    BillingSite:
      type: object
      required: [siteId, siteName, destinationCode, orderCount, orderTotal, feesTotal, confirmed]
      properties:
        siteId:
          type: integer
        siteName:
          type: string
        destinationCode:
          type: string
        orderCount:
          type: integer
        orderTotal:
          type: number
          description: Sum of order amounts for the month. Currency to be confirmed.
        feesTotal:
          type: number
          description: Shipping and fees booked to this site for the month.
        invoiceAmount:
          type: number
          nullable: true
          description: The amount for this site on the supplier's invoice. Null until the invoice is received.
        confirmed:
          type: boolean
        confirmedAt:
          type: string
          format: date-time
          nullable: true
    BillingMonth:
      type: object
      required: [month, sites]
      properties:
        month:
          type: string
        invoiceTotal:
          type: number
          nullable: true
          description: Total of the single monthly invoice, when received.
        sites:
          type: array
          items:
            $ref: '#/components/schemas/BillingSite'
    StatementLine:
      type: object
      required: [orderId, deliveryDate, itemName, quantity, amount, fee]
      properties:
        orderId:
          type: integer
        deliveryDate:
          type: string
          format: date
        itemName:
          type: string
        quantity:
          type: integer
        amount:
          type: number
        fee:
          type: number
    BillingStatement:
      type: object
      required: [month, site, lines]
      properties:
        month:
          type: string
        site:
          $ref: '#/components/schemas/BillingSite'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/StatementLine'
